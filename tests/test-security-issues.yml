name: Test security issues detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bandit
        uses: .
        with:
          path: tests/fixtures/insecure
        continue-on-error: true

      - name: Assert bandit detected security issues
        env:
          OUTCOME: ${{ steps.bandit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Bandit should exit non-zero when it finds security issues
          # The entrypoint uses set -e so bandit finding issues causes failure
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: bandit step was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected bandit to fail (find issues) on insecure code but outcome was $OUTCOME"
            exit 1
          fi
          echo "PASS: bandit correctly detected security issues in insecure code"
