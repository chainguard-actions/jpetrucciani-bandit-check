name: Test bandit detects insecure code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run bandit on insecure Python code (expect failure)
        id: action
        uses: .
        with:
          path: ./tests/fixtures/insecure
        continue-on-error: true
      - name: Assert bandit detected security issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected bandit to fail on insecure code, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: bandit correctly detected security issues and failed"
